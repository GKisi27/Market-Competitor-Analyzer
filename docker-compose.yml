services:

  db:
    image: postgres:15
    container_name: mca_db
    environment:
      POSTGRES_DB: Market_competitor_Analyzer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "0490036"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: mca_backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:0490036@db:5432/Market_competitor_Analyzer
      SECRET_KEY: dev-secret-key-change-in-production
      APP_ENV: development
      PROJECT_NAME: Market Competitor Analyzer
      API_V1_STR: /api/v1
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./crawler:/crawler
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: mca_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    restart: unless-stopped

volumes:
  postgres_data: